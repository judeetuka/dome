[package]
name = "dome-image"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = "1"
libc = "0.2"
dome-core = { path = "../dome-core" }
dome-crypto = { path = "../dome-crypto" }
thiserror.workspace = true

[dev-dependencies]
age = { version = "0.11", default-features = false }

# [lints] workspace = true cannot be combined with an override: the manifest will not parse.
# unsafe_code stays at warn rather than allow so every block is visible in review.
[lints.rust]
unsafe_code = "warn"
