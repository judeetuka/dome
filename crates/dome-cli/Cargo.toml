[package]
name = "dome-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dome"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dome-config = { path = "../dome-config" }
thiserror = { workspace = true }
dome-host-linux = { path = "../dome-host-linux" }
dome-core = { path = "../dome-core" }
dome-crypto = { path = "../dome-crypto" }
dome-image = { path = "../dome-image" }
dome-engine = { path = "../dome-engine" }
dome-supervisor = { path = "../dome-supervisor" }
age = { version = "0.11", default-features = false }
dome-obfuscation = { path = "../dome-obfuscation" }

[lints]
workspace = true

[dev-dependencies]
dome-image = { path = "../dome-image" }
